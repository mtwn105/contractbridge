[project]
name = "contractbridge"
version = "0.1.0"
description = "Verified compatibility bridges for breaking REST API changes"
requires-python = ">=3.14,<3.15"
dependencies = [
  "starlette==1.7.0",
  "httpx==0.28.1",
  "uvicorn==0.54.0",
  "jsonschema==4.26.0",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
deploy = [
    "psycopg[binary]==3.3.6",
    "sentry-sdk==2.73.0",
    "temporalio==1.34.0",
]

[dependency-groups]
dev = ["playwright==1.64.1", "pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.9"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests", "examples/tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv]
constraint-dependencies = [
  'anyio==4.15.1',
  'attrs==26.1.0',
  'certifi==2026.7.22',
  'click==8.5.0',
  'h11==0.16.0',
  'httpcore==1.0.9',
  'httpx==0.28.1',
  'idna==3.20',
  'iniconfig==2.3.1',
  'jsonschema==4.26.0',
  'jsonschema-specifications==2025.9.1',
  'packaging==26.3',
  'pluggy==1.7.0',
  'pygments==2.21.0',
  'pytest==9.1.1',
  'pytest-asyncio==1.4.0',
  'PyYAML==6.0.3',
  'referencing==0.37.0',
  'rpds-py==2026.9.1',
  'ruff==0.16.9',
  'starlette==1.7.0',
  'typing-extensions==4.16.0',
  'uvicorn==0.54.0',
]
